<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Masuk · Bersihin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/bersihin.css">
</head>
<body>
    <main class="auth">
        <div class="auth-kotak">
            <a href="landing.html" class="logo">
                <svg width="28" height="28" viewBox="0 0 26 26" aria-hidden="true"><path d="M6 6.5a7 5 0 0 1 14 0" fill="none" stroke="#2453D8" stroke-width="2"/><path d="M3.5 9h19l-2.2 13.2a2 2 0 0 1-2 1.8H7.7a2 2 0 0 1-2-1.8z" fill="#EAF0FF" stroke="#2453D8" stroke-width="2" stroke-linejoin="round"/><path d="M5.2 15.5h15.6l-1.1 6.6a1 1 0 0 1-1 .9H7.3a1 1 0 0 1-1-.9z" fill="#2453D8"/></svg>
                bersihin
            </a>
            <h1>Masuk</h1>
            <p class="lead">Pakai email yang terdaftar.</p>

            <!-- Pesan gagal masuk, varian #salah -->
            <div class="pesan pesan-salah" role="alert" data-saat="salah">Email atau kata sandi salah.</div>

            <!-- Mockup: arahkan ke beranda pelanggan. Blade: POST ke route login -->
            <form action="pelanggan/beranda.html" method="get" data-proses="Masuk...">
                <div class="isian">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="nama@email.com" required>
                </div>
                <div class="isian">
                    <label for="password">Kata sandi</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <div class="baris-tipis">
                    <label class="centang"><input type="checkbox" name="remember"> Ingat aku</label>
                </div>
                <button type="submit" class="btn btn-utama btn-penuh">Masuk</button>
            </form>

            <p class="bawah">Belum punya akun? <a href="daftar.html">Daftar</a></p>
        </div>
    </main>
    <script src="assets/mockup.js"></script>
</body>
</html>
