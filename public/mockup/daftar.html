<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daftar · Bersihin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/bersihin.css">
</head>
<body>
    <main class="auth">
        <div class="auth-kotak">
            <a href="landing.html" class="logo">
                <svg width="28" height="28" viewBox="0 0 26 26" aria-hidden="true"><path d="M6 6.5a7 5 0 0 1 14 0" fill="none" stroke="#2453D8" stroke-width="2"/><path d="M3.5 9h19l-2.2 13.2a2 2 0 0 1-2 1.8H7.7a2 2 0 0 1-2-1.8z" fill="#EAF0FF" stroke="#2453D8" stroke-width="2" stroke-linejoin="round"/><path d="M5.2 15.5h15.6l-1.1 6.6a1 1 0 0 1-1 .9H7.3a1 1 0 0 1-1-.9z" fill="#2453D8"/></svg>
                bersihin
            </a>
            <h1>Bikin akun</h1>
            <p class="lead">Sekali daftar, langsung bisa pesan.</p>

            <!-- Contoh galat validasi, varian #salah -->
            <div class="pesan pesan-salah" role="alert" data-saat="salah">Cek lagi isianmu.</div>

            <!-- Mockup: arahkan ke beranda pelanggan. Blade: POST ke route register -->
            <form action="pelanggan/beranda.html" method="get" data-proses="Mendaftar...">
                <fieldset class="pilihan isian">
                    <legend>Daftar sebagai</legend>
                    <div class="segmen">
                        <label class="opsi"><input type="radio" name="role" value="pelanggan" checked> Pelanggan</label>
                        <label class="opsi"><input type="radio" name="role" value="petugas" id="peran-petugas"> Petugas</label>
                    </div>
                </fieldset>

                <div class="pesan pesan-tunggu" id="catatan-petugas" hidden>Akun petugas perlu diverifikasi admin dulu.</div>

                <div class="isian">
                    <label for="nama">Nama lengkap</label>
                    <input type="text" id="nama" name="nama" autocomplete="name" required>
                </div>
                <div class="isian" data-saat="awal petugas">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="nama@email.com" required>
                </div>
                <div class="isian isian-salah" data-saat="salah">
                    <label for="email-salah">Email</label>
                    <input type="email" id="email-salah" name="email" autocomplete="email" value="fatirtir@bersihin.test" aria-describedby="galat-email" aria-invalid="true">
                    <p class="galat" id="galat-email">Email sudah terdaftar.</p>
                </div>
                <div class="isian">
                    <label for="no_hp">Nomor HP</label>
                    <input type="tel" id="no_hp" name="no_hp" autocomplete="tel" inputmode="tel" placeholder="08xxxxxxxxxx" required>
                </div>
                <div class="isian">
                    <label for="password">Kata sandi</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
                    <p class="bantu">Minimal 8 karakter.</p>
                </div>
                <div class="isian">
                    <label for="password_confirmation">Ulangi kata sandi</label>
                    <input type="password" id="password_confirmation" name="password_confirmation" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-utama btn-penuh">Daftar</button>
            </form>

            <p class="bawah">Sudah punya akun? <a href="masuk.html">Masuk</a></p>
        </div>
    </main>
    <script src="assets/mockup.js"></script>
</body>
</html>
