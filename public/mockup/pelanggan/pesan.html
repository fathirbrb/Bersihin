<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pesan petugas · Bersihin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/bersihin.css">
</head>
<body class="app">
    <header class="bar">
        <div class="bar-isi">
            <a href="beranda.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 26 26" aria-hidden="true"><path d="M6 6.5a7 5 0 0 1 14 0" fill="none" stroke="#2453D8" stroke-width="2"/><path d="M3.5 9h19l-2.2 13.2a2 2 0 0 1-2 1.8H7.7a2 2 0 0 1-2-1.8z" fill="#EAF0FF" stroke="#2453D8" stroke-width="2" stroke-linejoin="round"/><path d="M5.2 15.5h15.6l-1.1 6.6a1 1 0 0 1-1 .9H7.3a1 1 0 0 1-1-.9z" fill="#2453D8"/></svg>
                bersihin
            </a>
            <!-- Tab pelanggan, pindah ke bawah di HP -->
            <nav aria-label="Menu pelanggan">
                <ul class="tab">
                    <li><a href="beranda.html"><span class="ikon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg></span>Beranda</a></li>
                    <li><a href="pesan.html" class="aktif" aria-current="page"><span class="ikon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8a5 4 0 0 1 10 0"/><path d="M4 8h16l-1.8 11.2a1.5 1.5 0 0 1-1.5 1.3H7.3a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M12 11v6M9 14h6"/></svg></span>Pesan</a></li>
                    <li><a href="pesanan.html"><span class="ikon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 3.5h6v3H9zM9 11h6M9 15h4"/></svg></span>Pesananku</a></li>
                    <li><a href="ulasan.html"><span class="ikon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4 2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.4l-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z"/></svg></span>Ulasan</a></li>
                </ul>
            </nav>
            <!-- Ke profil, Blade: tampilkan foto kalau ada -->
            <a href="profil.html" class="avatar" aria-label="Profil Fatirtir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5a7 7 0 0 1 14 0"/></svg></a>
        </div>
    </header>

    <main class="sempit">
        <div class="kepala">
            <h1>Pesan petugas</h1>
            <p>Bayar setelah pesanan dibuat.</p>
        </div>

        <!-- Galat validasi, varian #salah -->
        <div class="pesan pesan-salah" role="alert" data-saat="salah">Ada yang belum diisi.</div>

        <!-- Mockup: lanjut ke detail. Blade: POST pelanggan.pesanan.store -->
        <form action="pesanan-detail.html" method="get" data-proses="Mengirim...">
            <fieldset class="pilihan isian">
                <legend>Paket</legend>
                <label class="opsi">
                    <input type="radio" name="paket_layanan_id" value="9" data-harga="Rp150.000" required>
                    <span><span class="judul-baris">Pembersihan Rutin</span><span class="sub-baris">Menyapu, mengepel, merapikan ruangan</span></span>
                    <span style="text-align:right;flex:none;"><span class="harga" style="display:block;">Rp150.000</span><span class="sub-baris">± 3 jam</span></span>
                </label>
                <label class="opsi">
                    <input type="radio" name="paket_layanan_id" value="10" data-harga="Rp350.000">
                    <span><span class="judul-baris">Deep Cleaning</span><span class="sub-baris">Kamar mandi, dapur, dan lantai secara menyeluruh</span></span>
                    <span style="text-align:right;flex:none;"><span class="harga" style="display:block;">Rp350.000</span><span class="sub-baris">± 6 jam</span></span>
                </label>
                <label class="opsi">
                    <input type="radio" name="paket_layanan_id" value="11" data-harga="Rp250.000">
                    <span><span class="judul-baris">Cuci Sofa dan Kasur</span><span class="sub-baris">Pembersihan sofa dan kasur</span></span>
                    <span style="text-align:right;flex:none;"><span class="harga" style="display:block;">Rp250.000</span><span class="sub-baris">± 4 jam</span></span>
                </label>
                <label class="opsi">
                    <input type="radio" name="paket_layanan_id" value="12" data-harga="Rp500.000">
                    <span><span class="judul-baris">Pembersihan Pascarenovasi</span><span class="sub-baris">Membersihkan sisa debu dan material setelah renovasi</span></span>
                    <span style="text-align:right;flex:none;"><span class="harga" style="display:block;">Rp500.000</span><span class="sub-baris">± 8 jam</span></span>
                </label>
            </fieldset>

            <div class="isian" data-saat="awal">
                <label for="alamat">Alamat</label>
                <textarea id="alamat" name="alamat" rows="3" autocomplete="street-address" placeholder="Jalan, nomor rumah, kelurahan" required></textarea>
            </div>
            <div class="isian isian-salah" data-saat="salah">
                <label for="alamat-salah">Alamat</label>
                <textarea id="alamat-salah" name="alamat" rows="3" aria-invalid="true" aria-describedby="galat-alamat"></textarea>
                <p class="galat" id="galat-alamat">Alamat belum diisi.</p>
            </div>

            <div class="isian-dua">
                <div class="isian">
                    <label for="tanggal">Tanggal</label>
                    <input type="date" id="tanggal" name="tanggal" required>
                </div>
                <div class="isian">
                    <label for="jam_mulai">Jam mulai</label>
                    <input type="time" id="jam_mulai" name="jam_mulai" required>
                </div>
            </div>

            <div class="isian">
                <label for="catatan">Catatan <span class="sub-baris" style="display:inline;">(opsional)</span></label>
                <textarea id="catatan" name="catatan" rows="3" placeholder="Misal: pagar hijau, ada kucing di rumah"></textarea>
            </div>

            <button type="submit" class="btn btn-utama btn-penuh" id="tombol-pesan">Pesan</button>
        </form>
    </main>
    <script src="../assets/mockup.js"></script>
</body>
</html>
