<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kasih ulasan · Bersihin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/bersihin.css">
</head>
<body class="app">
    <header class="bar">
        <div class="bar-isi">
            <a href="beranda.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 26 26" aria-hidden="true"><path d="M6 6.5a7 5 0 0 1 14 0" fill="none" stroke="#2453D8" stroke-width="2"/><path d="M3.5 9h19l-2.2 13.2a2 2 0 0 1-2 1.8H7.7a2 2 0 0 1-2-1.8z" fill="#EAF0FF" stroke="#2453D8" stroke-width="2" stroke-linejoin="round"/><path d="M5.2 15.5h15.6l-1.1 6.6a1 1 0 0 1-1 .9H7.3a1 1 0 0 1-1-.9z" fill="#2453D8"/></svg>
                bersihin
            </a>
            <!-- Tab pelanggan, pindah ke bawah di HP -->
            <nav aria-label="Menu pelanggan">
                <ul class="tab">
                    <li><a href="beranda.html"><span class="ikon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg></span>Beranda</a></li>
                    <li><a href="pesan.html"><span class="ikon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8a5 4 0 0 1 10 0"/><path d="M4 8h16l-1.8 11.2a1.5 1.5 0 0 1-1.5 1.3H7.3a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M12 11v6M9 14h6"/></svg></span>Pesan</a></li>
                    <li><a href="pesanan.html"><span class="ikon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 3.5h6v3H9zM9 11h6M9 15h4"/></svg></span>Pesananku</a></li>
                    <li><a href="ulasan.html" class="aktif" aria-current="page"><span class="ikon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4 2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.4l-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z"/></svg></span>Ulasan</a></li>
                </ul>
            </nav>
            <!-- Ke profil, Blade: tampilkan foto kalau ada -->
            <a href="profil.html" class="avatar" aria-label="Profil Fatirtir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5a7 7 0 0 1 14 0"/></svg></a>
        </div>
    </header>

    <main class="sempit">
        <a href="ulasan.html" class="kembali"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Ulasan</a>

        <div class="kepala">
            <h1>Gimana hasilnya?</h1>
            <p>Deep Cleaning · Selasa, 27 Oktober · Rifanjir</p>
        </div>

        <div class="pesan pesan-salah" role="alert" data-saat="salah">Pilih bintangnya dulu.</div>

        <!-- Mockup: balik ke daftar ulasan. Blade: POST pelanggan.ulasan.store -->
        <form action="ulasan.html#terkirim" method="get" data-proses="Mengirim...">
            <fieldset class="isian" style="border:none;">
                <legend class="judul-isian">Bintang</legend>
                <div class="rating">
                    <input type="radio" name="rating" id="r1" value="1" data-label="Kecewa" required><label for="r1"><span class="sr">1 bintang</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></label>
                    <input type="radio" name="rating" id="r2" value="2" data-label="Kurang"><label for="r2"><span class="sr">2 bintang</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></label>
                    <input type="radio" name="rating" id="r3" value="3" data-label="Lumayan"><label for="r3"><span class="sr">3 bintang</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></label>
                    <input type="radio" name="rating" id="r4" value="4" data-label="Bagus"><label for="r4"><span class="sr">4 bintang</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></label>
                    <input type="radio" name="rating" id="r5" value="5" data-label="Mantap"><label for="r5"><span class="sr">5 bintang</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></label>
                </div>
                <p class="rating-label" id="rating-label" aria-live="polite"></p>
            </fieldset>

            <div class="isian">
                <label for="komentar">Komentar <span class="sub-baris" style="display:inline;">(opsional)</span></label>
                <textarea id="komentar" name="komentar" rows="4" placeholder="Ceritain sedikit"></textarea>
            </div>

            <button type="submit" class="btn btn-utama btn-penuh">Kirim ulasan</button>
        </form>
    </main>
    <script src="../assets/mockup.js"></script>
</body>
</html>
